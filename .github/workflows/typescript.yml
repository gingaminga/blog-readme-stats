name: Check Typescript

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit
